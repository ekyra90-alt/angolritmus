<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zene & Karaoke Lejátszó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adat.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 select-none">

  <header class="border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950 py-3 px-4 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2">
        <a id="backLink" href="index.html" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold active:scale-95 transition-transform">❮ Vissza</a>
        <button id="homeBtn" class="hidden text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold active:scale-95 transition-transform">🏠 Témakörök</button>
        <span class="text-sm md:text-base font-bold tracking-wide truncate">Zenei Karaoke Stúdió</span>
      </div>
      <select id="songSelect" class="hidden text-xs md:text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 outline-none max-w-[160px] truncate"></select>
    </div>
  </header>

  <audio id="zene" preload="auto"></audio>

  <main class="flex-1 max-w-2xl w-full mx-auto p-3 md:p-6 flex flex-col gap-4">

    <!-- 1) TÉMAKÖR-VÁLASZTÓ KÉPERNYŐ -->
    <div id="topicScreen" class="flex-1 flex flex-col items-center justify-center text-center py-8 px-2 space-y-3">
      <p class="text-4xl md:text-5xl">🎧</p>
      <h1 class="text-2xl md:text-4xl font-black tracking-tight text-slate-800 dark:text-slate-100">Válassz témakört</h1>
      <p class="text-xs md:text-sm text-slate-400 max-w-sm mx-auto">és kezdj el tanulni angol dalokkal!</p>
      <div id="topicList" class="w-full max-w-sm mx-auto space-y-3 pt-4"></div>
    </div>

    <!-- 2) DALVÁLASZTÓ KÉPERNYŐ -->
    <div id="songScreen" class="hidden flex-1 flex-col items-center justify-center text-center py-6 px-2 space-y-3">
      <button id="backToTopicsBtn" class="self-start text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold">❮ Témakörök</button>
      <p class="text-3xl pt-2">🎵</p>
      <h2 id="songScreenTitle" class="text-xl md:text-3xl font-black tracking-tight"></h2>
      <div id="songListInTopic" class="w-full max-w-sm mx-auto space-y-3 pt-4"></div>
    </div>

    <!-- 3) LEJÁTSZÓ FELÜLET -->
    <div id="playerScreen" class="hidden flex-1 flex-col gap-4">
      <div id="loadError" class="hidden bg-rose-50 text-rose-600 text-xs font-bold rounded-2xl p-4"></div>

      <!-- Folyton látszódó, ragadós vezérlők -->
      <div class="sticky top-[57px] z-20 bg-slate-50 dark:bg-slate-900 pb-2 pt-1">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm p-3 space-y-2.5">
          <div class="flex items-center justify-center gap-2">
            <button id="seekBackBtn" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-200 rounded-xl font-bold text-xs active:scale-95 transition-transform">⏪ -5mp</button>
            <button id="playPauseBtn" class="px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-bold text-xs md:text-sm active:scale-95 transition-transform">▶️ Lejátszás</button>
            <button id="seekForwardBtn" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-200 rounded-xl font-bold text-xs active:scale-95 transition-transform">+5mp ⏩</button>
          </div>
          <div class="flex items-center gap-2.5">
            <span id="currentTime" class="text-xs font-mono text-slate-400 min-w-[32px]">0:00</span>
            <input type="range" id="progressBar" value="0" class="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none accent-violet-600">
            <span id="duration" class="text-xs font-mono text-slate-400 min-w-[32px]">0:00</span>
          </div>
          <div class="flex items-center justify-center gap-4 pt-1 flex-wrap">
            <div class="flex items-center gap-1">
              <span class="text-xs">🎵 Zene:</span>
              <select id="playbackSpeedSelect" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-[11px] font-bold">
                <option value="0.75">0.75x</option>
                <option value="0.9">0.9x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
              </select>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-xs">🗣️ Szöveg:</span>
              <select id="ttsSpeedSelect" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-[11px] font-bold">
                <option value="0.6">0.6x</option>
                <option value="0.8" selected>0.8x</option>
                <option value="1.0">1.0x</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl border p-4 md:p-6 space-y-4" id="lyricsBox"></div>
    </div>

    <div id="emptyState" class="hidden bg-white dark:bg-slate-800 rounded-3xl border p-6 text-center space-y-2">
      <p class="text-3xl">🎼</p>
      <p class="font-bold text-sm">Még nincs feltöltve dal az adat.js-be.</p>
    </div>

  </main>

  <script>
    const audio = document.getElementById("zene");
    const synth = window.speechSynthesis;
    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekBackBtn = document.getElementById("seekBackBtn");
    const seekForwardBtn = document.getElementById("seekForwardBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeText = document.getElementById("currentTime");
    const durationText = document.getElementById("duration");
    const playbackSpeedSelect = document.getElementById("playbackSpeedSelect");
    const ttsSpeedSelect = document.getElementById("ttsSpeedSelect");
    const lyricsBox = document.getElementById("lyricsBox");
    const loadError = document.getElementById("loadError");
    const backLink = document.getElementById("backLink");
    const homeBtn = document.getElementById("homeBtn");
    const songSelect = document.getElementById("songSelect");

    const topicScreen = document.getElementById("topicScreen");
    const topicList = document.getElementById("topicList");
    const songScreen = document.getElementById("songScreen");
    const songScreenTitle = document.getElementById("songScreenTitle");
    const songListInTopic = document.getElementById("songListInTopic");
    const backToTopicsBtn = document.getElementById("backToTopicsBtn");
    const playerScreen = document.getElementById("playerScreen");
    const emptyState = document.getElementById("emptyState");

    let currentSong = null;
    let isMusicPlaying = false;
    let activePauseLine = null;
    let lastActiveLineKey = null;
    let mediaRecorder = null;
    let audioChunks = [];

    if (typeof BACK_LINK !== "undefined") backLink.href = BACK_LINK;
    const topics = (typeof TOPICS !== "undefined") ? TOPICS : [];

    const flatSongs = [];
    topics.forEach((topic, tIdx) => {
      (topic.songs || []).forEach((song, sIdx) => {
        flatSongs.push({ topicIndex: tIdx, songIndex: sIdx, topic, song });
      });
    });

    function showTopicScreen() {
      topicScreen.classList.remove('hidden');
      songScreen.classList.add('hidden');
      playerScreen.classList.add('hidden');
      songSelect.classList.add('hidden');
      homeBtn.classList.add('hidden');
      audio.pause();
    }

    function showSongScreen(topicIndex) {
      const topic = topics[topicIndex];
      songScreenTitle.textContent = topic.title;
      songListInTopic.innerHTML = '';
      (topic.songs || []).forEach((song, sIdx) => {
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between bg-white dark:bg-slate-800 border rounded-2xl px-4 py-3 shadow-sm font-bold text-left";
        card.innerHTML = `<span>${song.title}</span><span class="text-violet-500">▶️</span>`;
        card.addEventListener('click', () => selectSong(topicIndex, sIdx));
        songListInTopic.appendChild(card);
      });
      topicScreen.classList.add('hidden');
      songScreen.classList.remove('hidden');
      playerScreen.classList.add('hidden');
    }

    function buildTopicList() {
      topicList.innerHTML = '';
      topics.forEach((topic, tIdx) => {
        const count = (topic.songs || []).length;
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between bg-white dark:bg-slate-800 border rounded-2xl px-4 py-3 shadow-sm font-bold text-left";
        card.innerHTML = `<span>${topic.title} (${count} dal)</span><span class="text-violet-500">❯</span>`;
        card.addEventListener('click', () => showSongScreen(tIdx));
        topicList.appendChild(card);
      });
    }

    function buildSongSelect() {
      songSelect.innerHTML = '';
      topics.forEach((topic, tIdx) => {
        const group = document.createElement('optgroup');
        group.label = topic.title;
        (topic.songs || []).forEach((song, sIdx) => {
          const opt = document.createElement('option');
          opt.value = `${tIdx}-${sIdx}`;
          opt.textContent = song.title;
          group.appendChild(opt);
        });
        songSelect.appendChild(group);
      });
    }

    songSelect.addEventListener('change', () => {
      const [tIdx, sIdx] = songSelect.value.split('-').map(Number);
      selectSong(tIdx, sIdx);
    });

    homeBtn.addEventListener('click', showTopicScreen);
    backToTopicsBtn.addEventListener('click', showTopicScreen);

    function selectSong(tIdx, sIdx) {
      topicScreen.classList.add('hidden');
      songScreen.classList.add('hidden');
      playerScreen.classList.remove('hidden');
      songSelect.classList.remove('hidden');
      homeBtn.classList.remove('hidden');
      songSelect.value = `${tIdx}-${sIdx}`;
      loadSong(topics[tIdx].songs[sIdx]);
    }

    function loadSong(song) {
      currentSong = song;
      audio.pause();
      isMusicPlaying = false;
      activePauseLine = null;
      playPauseBtn.textContent = "▶️ Lejátszás";
      loadError.classList.add('hidden');
      audio.src = currentSong.localAudio || "";
      audio.playbackRate = parseFloat(playbackSpeedSelect.value) || 1.0;
      audio.load();

      audio.onerror = function() {
        if (currentSong.fallbackAudio && audio.src.indexOf(currentSong.fallbackAudio) === -1) {
          audio.src = currentSong.fallbackAudio;
          audio.load();
        } else {
          loadError.textContent = `Nem sikerült betölteni a(z) "${currentSong.title}" hangfájlját.`;
          loadError.classList.remove('hidden');
        }
      };

      buildUI();
    }

    function speakSentence(text) {
      if (!synth) return;
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/\*\*/g, ''));
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(ttsSpeedSelect.value) || 0.8;
      synth.speak(utterance);
    }

    window.speakKeywordOnly = function(event, word) {
      if (event) event.stopPropagation();
      if (!synth) return;
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(ttsSpeedSelect.value) || 0.8;
      synth.speak(utterance);
    };

    async function setupRecorder(playbackAudio) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/mp3' });
          playbackAudio.src = URL.createObjectURL(blob);
          playbackAudio.classList.remove('hidden');
        };
        return true;
      } catch (err) {
        alert("A mikrofon használata nem engedélyezett.");
        return false;
      }
    }

    function buildUI() {
      const hasSong = currentSong && currentSong.songStructureData && currentSong.songStructureData.length > 0;
      emptyState.classList.toggle('hidden', hasSong);
      if (!hasSong) {
        lyricsBox.innerHTML = '';
        return;
      }

      lyricsBox.innerHTML = '';
      currentSong.songStructureData.forEach((verse, vIdx) => {
        const vDiv = document.createElement('div');
        vDiv.className = "space-y-3";
        vDiv.innerHTML = `<h4 class="font-bold text-slate-400 text-xs uppercase">${verse.title}</h4>`;

        verse.lines.forEach((line, lIdx) => {
          const hasKeyword = /\*\*(.*?)\*\*/.test(line.text);
          const lDiv = document.createElement('div');
          lDiv.id = `line-${vIdx}-${lIdx}`;
          lDiv.className = "p-3 rounded-xl border flex flex-col gap-2 bg-slate-50 dark:bg-slate-900 transition-all border-transparent";

          const textRow = document.createElement('div');
          textRow.className = "cursor-pointer";
          textRow.innerHTML = `
            <p class="font-semibold text-sm md:text-base">${line.text.replace(/\*\*(.*?)\*\*/g, (m, word) => {
              const clean = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
              return `<span onclick="speakKeywordOnly(event, '${clean.replace(/'/g, "\\'")}')" class="text-violet-600 dark:text-violet-400 font-bold underline decoration-2">${word}</span>`;
            })}</p>
            <p class="text-xs text-slate-400">${line.hungarian}</p>
          `;
          textRow.addEventListener('click', () => {
            activePauseLine = null;
            audio.currentTime = line.start;
            audio.play();
            isMusicPlaying = true;
            playPauseBtn.textContent = "⏸️ Szünet";
          });

          const btnRow = document.createElement('div');
          btnRow.className = "flex items-center gap-2 pt-2 border-t border-slate-200 dark:border-slate-800";

          const speakBtn = document.createElement('button');
          speakBtn.className = "px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-lg hover:bg-violet-100";
          speakBtn.textContent = "🗣️ Felolvas";
          speakBtn.addEventListener('click', () => speakSentence(line.text));

          btnRow.appendChild(speakBtn);

          // Csak a kulcsszavas mondatoknál van hangfelvevő gomb
          if (hasKeyword) {
            const recordBtn = document.createElement('button');
            recordBtn.className = "px-2.5 py-1 bg-rose-500 text-white text-xs font-bold rounded-lg";
            recordBtn.textContent = "🎙️ Felvétel";

            const playback = document.createElement('audio');
            playback.controls = true;
            playback.className = "hidden h-7 flex-1";

            let isRecording = false;
            recordBtn.addEventListener('click', async () => {
              if (!isRecording) {
                const ok = await setupRecorder(playback);
                if (ok) {
                  mediaRecorder.start();
                  isRecording = true;
                  recordBtn.textContent = "⏹️ Stop";
                  recordBtn.className = "px-2.5 py-1 bg-amber-500 text-white text-xs font-bold rounded-lg animate-pulse";
                }
              } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "🎙️ Újra";
                recordBtn.className = "px-2.5 py-1 bg-rose-500 text-white text-xs font-bold rounded-lg";
              }
            });

            btnRow.appendChild(recordBtn);
            btnRow.appendChild(playback);
          }

          lDiv.appendChild(textRow);
          lDiv.appendChild(btnRow);
          vDiv.appendChild(lDiv);
        });
        lyricsBox.appendChild(vDiv);
      });
    }

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        isMusicPlaying = true;
        playPauseBtn.textContent = "⏸️ Szünet";
      } else {
        audio.pause();
        isMusicPlaying = false;
        playPauseBtn.textContent = "▶️ Lejátszás";
      }
    });

    seekBackBtn.addEventListener('click', () => {
      if (!isNaN(audio.duration)) {
        activePauseLine = null;
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      }
    });

    seekForwardBtn.addEventListener('click', () => {
      if (!isNaN(audio.duration)) {
        activePauseLine = null;
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      }
    });

    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      if (!isNaN(audio.duration)) {
        progressBar.value = (cur / audio.duration) * 100;
        currentTimeText.textContent = formatTime(cur);
        durationText.textContent = formatTime(audio.duration);
      }

      if (currentSong && currentSong.songStructureData) {
        let activeKey = null;
        let activeIsVerseStart = false;

        currentSong.songStructureData.forEach((verse, vIdx) => {
          verse.lines.forEach((line, lIdx) => {
            const el = document.getElementById(`line-${vIdx}-${lIdx}`);
            if (el) {
              const hasKeyword = /\*\*(.*?)\*\*/.test(line.text);
              const lineKey = `${vIdx}-${lIdx}`;

              if (cur >= line.start && cur < line.end) {
                el.classList.add('bg-violet-50', 'dark:bg-violet-900/30', 'border-violet-300', 'scale-[1.01]');
                activeKey = lineKey;
                activeIsVerseStart = (lIdx === 0);

                // Automatikus megállás a kulcsszavas mondat végén
                if (hasKeyword && cur >= line.end - 0.1 && activePauseLine !== lineKey) {
                  activePauseLine = lineKey;
                  audio.pause();
                  isMusicPlaying = false;
                  playPauseBtn.textContent = "▶️ Lejátszás";
                }
              } else {
                el.classList.remove('bg-violet-50', 'dark:bg-violet-900/30', 'border-violet-300', 'scale-[1.01]');
              }
            }
          });
        });

        if (activeKey && activeKey !== lastActiveLineKey) {
          lastActiveLineKey = activeKey;
          const el = document.getElementById(`line-${activeKey}`);
          if (el && activeIsVerseStart) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      }
    });

    progressBar.addEventListener('input', (e) => {
      if (!isNaN(audio.duration)) {
        activePauseLine = null;
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    playbackSpeedSelect.addEventListener('change', () => {
      audio.playbackRate = parseFloat(playbackSpeedSelect.value) || 1.0;
    });

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    if (flatSongs.length > 0) {
      buildTopicList();
      buildSongSelect();
    } else {
      topicScreen.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }
  </script>
</body>
</html>
