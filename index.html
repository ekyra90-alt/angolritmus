<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulási Irányítópult</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script src="adat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">

    <div class="bg-indigo-600 p-8 rounded-b-[2rem] text-white shadow-md">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-extrabold mb-1">Tanulási Útvonal</h1>
            <p class="text-indigo-100 opacity-90" id="songSubtitle">Haladj lépésről lépésre a mesteri tudásig.</p>
        </div>
    </div>

    <main class="max-w-md mx-auto px-6 mt-8">
        <div id="module-list" class="space-y-4"></div>

        <!-- Különálló zenelejátszó stílusú doboz a rendszeres ismétléshez -->
        <div class="mt-8 pt-6 border-t border-slate-200">
            <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-3 px-1">Mindennapi gyakorlás</h2>
            <a href="zene_lejatszo.html" class="block group">
                <div class="bg-gradient-to-r from-indigo-500 to-violet-600 p-5 rounded-3xl shadow-md text-white flex items-center gap-4 hover:shadow-lg transition-all cursor-pointer">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center text-white text-2xl group-hover:scale-105 transition-transform">
                        🎵
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-lg text-white">Rendszeres ismétlés</h3>
                            <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">Audio</span>
                        </div>
                        <p class="text-xs text-indigo-100 opacity-90 mt-0.5">Szilárdítsd meg a tanultakat a dal rendszeres hallgatásával.</p>
                    </div>
                    <div class="text-indigo-200 group-hover:text-white transition-colors text-lg font-bold">❯</div>
                </div>
            </a>
        </div>
    </main>

    <script>
        // Ha az adat.js tartalmaz témaköröket/dalokat, kiírjuk alcímként
        if (typeof TOPICS !== "undefined" && TOPICS.length > 0) {
            const topicCount = TOPICS.length;
            const songCount = TOPICS.reduce((sum, t) => sum + (t.songs ? t.songs.length : 0), 0);
            document.getElementById("songSubtitle").textContent =
                `${topicCount} témakör, összesen ${songCount} dallal`;
        }

        // Színleképezés a Tailwind osztályokhoz, hogy biztosan betöltődjenek
        const colorMap = {
            rose: { bg: "bg-rose-50", text: "text-rose-500" },
            indigo: { bg: "bg-indigo-50", text: "text-indigo-500" },
            amber: { bg: "bg-amber-50", text: "text-amber-500" },
            emerald: { bg: "bg-emerald-50", text: "text-emerald-500" },
            sky: { bg: "bg-sky-50", text: "text-sky-500" },
            violet: { bg: "bg-violet-50", text: "text-violet-500" },
            pink: { bg: "bg-pink-50", text: "text-pink-500" }
        };

        const steps = [
            { title: "Dallamtanulás", desc: "Rögzítsd a kulcsszavakat, loopold a dal sorait és vésd be a memóriádba.", color: "indigo", link: "zene_lejatszo.html" },
            { title: "Mond utánam fejből", desc: "Szilárdítsd meg a tanultakat a dal sorainak ismétlésével.", color: "pink", link: "hangos_elism.html" },
            { title: "Karaoke", desc: "Egészítsd ki a mondatokat a hiányzó kulcsszavakkal.", color: "amber", link: "karaoke.html" },
            { title: "Szófordítás", desc: "Ellenőrizd tudásod: Mondd meg az angol szó magyar megfelelőjét.", color: "emerald", link: "szoforditas.html" },
            { title: "Tudásellenőrző teszt", desc: "Mondd ki hangosan az angol mondatokat és fejleszd az önbizalmad.", color: "sky", link: "beszedteszt.html" },
            { title: "MI-alapú mondatalkotás", desc: "Alkosd meg saját mondataidat, az MI pedig kijavítja a hibáidat.", color: "violet", link: "mi_mondatalkotas.html" }
        ];

        const container = document.getElementById('module-list');

        function renderSteps() {
            container.innerHTML = ""; // Tiszta lista
            steps.forEach((s, index) => {
                const colors = colorMap[s.color];
                container.innerHTML += `
                    <a href="${s.link}" class="block group">
                        <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4 hover:border-indigo-200 transition-all cursor-pointer">
                            <div class="w-16 h-16 ${colors.bg} rounded-2xl flex items-center justify-center ${colors.text} font-bold text-xl">${index + 1}</div>
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800">${s.title}</h3>
                                <p class="text-xs text-slate-400">${s.desc}</p>
                            </div>
                            <div class="text-slate-300 group-hover:text-indigo-500 transition-colors">❯</div>
                        </div>
                    </a>
                `;
            });
        }

        renderSteps();
    </script>
</body>
</html>
