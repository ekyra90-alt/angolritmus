<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanulási Irányítópult</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url('Roka.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Sötét réteg a kép fölött, hogy a szöveg mindig olvasható maradjon */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.35);
            z-index: -1;
        }

        .glass {
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(147, 197, 253, 0.18);
            box-shadow: 0 0 22px rgba(59, 130, 246, 0.12);
            transition: box-shadow 0.4s ease, background 0.4s ease, border-color 0.4s ease;
        }
        .glass:hover {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(147, 197, 253, 0.4);
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.35), 0 0 60px rgba(59, 130, 246, 0.15);
        }

        /* A cím szinte "kiég" a képből: izzó, lélegző fény-szöveg, doboz nélkül */
        .fox-title {
            color: #eef6ff;
            letter-spacing: 0.03em;
            text-shadow:
                0 0 6px rgba(191, 219, 254, 0.95),
                0 0 18px rgba(96, 165, 250, 0.8),
                0 0 36px rgba(59, 130, 246, 0.55),
                0 0 70px rgba(37, 99, 235, 0.35);
            animation: fox-breathe 4.5s ease-in-out infinite;
        }
        @keyframes fox-breathe {
            0%, 100% {
                text-shadow:
                    0 0 6px rgba(191, 219, 254, 0.9),
                    0 0 16px rgba(96, 165, 250, 0.7),
                    0 0 32px rgba(59, 130, 246, 0.45),
                    0 0 60px rgba(37, 99, 235, 0.28);
            }
            50% {
                text-shadow:
                    0 0 10px rgba(224, 238, 255, 1),
                    0 0 26px rgba(96, 165, 250, 0.95),
                    0 0 50px rgba(59, 130, 246, 0.7),
                    0 0 95px rgba(37, 99, 235, 0.5);
            }
        }

        /* Lassan sodródó fényfoltok, mintha a róka füstje tovaúszna a felületen */
        .wisp {
            position: fixed;
            border-radius: 50%;
            filter: blur(55px);
            opacity: 0.4;
            mix-blend-mode: screen;
            z-index: -1;
            pointer-events: none;
        }
        .wisp1 {
            width: 260px; height: 260px; top: 4%; left: -12%;
            background: radial-gradient(circle, rgba(96,165,250,0.6), transparent 70%);
            animation: drift1 16s ease-in-out infinite;
        }
        .wisp2 {
            width: 220px; height: 220px; bottom: 8%; right: -10%;
            background: radial-gradient(circle, rgba(59,130,246,0.55), transparent 70%);
            animation: drift2 20s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(45px, 35px); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(-35px, -45px); }
        }

        /* Izzó számjelvények a menüpontokon */
        .icon-glow {
            box-shadow: 0 0 14px rgba(96, 165, 250, 0.45), inset 0 0 10px rgba(96, 165, 250, 0.2);
        }

        .glass-strong {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
    <script src="adat.js"></script>
</head>
<body class="text-white pb-10">

    <div class="wisp wisp1"></div>
    <div class="wisp wisp2"></div>

    <div class="pt-12 pb-8 px-6 text-center relative z-10">
        <h1 class="fox-title text-4xl font-extrabold mb-2">Tanulási Útvonal</h1>
        <p class="text-sky-100/80 text-sm" id="songSubtitle">Haladj lépésről lépésre a mesteri tudásig.</p>
    </div>

    <main class="max-w-md mx-auto px-6 mt-8">
        <div id="module-list" class="space-y-4"></div>

        <!-- Különálló zenelejátszó stílusú doboz a rendszeres ismétléshez -->
        <div class="mt-8 pt-6 border-t border-white/20">
            <h2 class="text-xs font-bold tracking-wider text-slate-200 uppercase mb-3 px-1">Mindennapi gyakorlás</h2>
            <a href="zene_lejatszo.html" class="block group">
                <div class="glass p-5 rounded-3xl shadow-md text-white flex items-center gap-4 hover:bg-white/10 transition-all cursor-pointer">
                    <div class="w-14 h-14 bg-white/10 backdrop-blur-sm rounded-2xl flex items-center justify-center text-white text-2xl group-hover:scale-105 transition-transform">
                        🎵
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-lg text-white">Rendszeres ismétlés</h3>
                            <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">Audio</span>
                        </div>
                        <p class="text-xs text-slate-200 opacity-90 mt-0.5">Szilárdítsd meg a tanultakat a dal rendszeres hallgatásával.</p>
                    </div>
                    <div class="text-slate-300 group-hover:text-white transition-colors text-lg font-bold">❯</div>
                </div>
            </a>
        </div>
    </main>

    <script>
        // Ha az adat.js tartalmaz témaköröket/dalokat, kiírjuk alcímként
        if (typeof TOPICS !== "undefined" && TOPICS.length > 0) {
            const topicCount = TOPICS.length;
            const songCount = TOPICS.reduce((sum, t) => sum + (t.songs ? t.songs.length : 0), 0);
            document.getElementById("songSubtitle").textContent =
                `${topicCount} témakör, összesen ${songCount} dallal`;
        }

        // Színleképezés a Tailwind osztályokhoz, hogy biztosan betöltődjenek
        const colorMap = {
            rose: { bg: "bg-rose-400/20", text: "text-rose-300" },
            indigo: { bg: "bg-indigo-400/20", text: "text-indigo-300" },
            amber: { bg: "bg-amber-400/20", text: "text-amber-300" },
            emerald: { bg: "bg-emerald-400/20", text: "text-emerald-300" },
            sky: { bg: "bg-sky-400/20", text: "text-sky-300" },
            violet: { bg: "bg-violet-400/20", text: "text-violet-300" },
            pink: { bg: "bg-pink-400/20", text: "text-pink-300" }
        };

        const steps = [
            { title: "Dallamtanulás", desc: "Rögzítsd a kulcsszavakat, loopold a dal sorait és vésd be a memóriádba.", color: "indigo", link: "zene_lejatszo.html" },
            { title: "Karaoke", desc: "Egészítsd ki a mondatokat a hiányzó kulcsszavakkal.", color: "amber", link: "karaoke.html" },
            { title: "Ismételd utánam", desc: "Szilárdítsd meg a tanultakat a dal sorainak ismétlésével.", color: "pink", link: "hangos_elism.html" },
            { title: "Szófordítás", desc: "Ellenőrizd tudásod: Mondd meg az angol szó magyar megfelelőjét.", color: "emerald", link: "szoforditas.html" },
            { title: "Tudásellenőrző teszt", desc: "Mondd ki hangosan az angol mondatokat és fejleszd az önbizalmad.", color: "sky", link: "beszedteszt.html" },
            { title: "MI-alapú mondatalkotás", desc: "Alkosd meg saját mondataidat, az MI pedig kijavítja a hibáidat.", color: "violet", link: "mi_mondatalkotas.html" }
        ];

        const container = document.getElementById('module-list');

        function renderSteps() {
            container.innerHTML = ""; // Tiszta lista
            steps.forEach((s, index) => {
                const colors = colorMap[s.color];
                container.innerHTML += `
                    <a href="${s.link}" class="block group">
                        <div class="glass p-4 rounded-3xl shadow-sm flex items-center gap-4 hover:bg-white/10 transition-all cursor-pointer">
                            <div class="w-16 h-16 ${colors.bg} icon-glow rounded-2xl flex items-center justify-center ${colors.text} font-bold text-xl">${index + 1}</div>
                            <div class="flex-1">
                                <h3 class="font-bold text-white">${s.title}</h3>
                                <p class="text-xs text-slate-300">${s.desc}</p>
                            </div>
                            <div class="text-slate-300 group-hover:text-white transition-colors">❯</div>
                        </div>
                    </a>
                `;
            });
        }

        renderSteps();
    </script>
</body>
</html>
