<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angol Beszéd Teszt — Dalok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adat.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

  <header class="border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950 py-4 px-6 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="backBtn" onclick="goBack()" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2 rounded-xl font-bold">❮ Vissza</button>
        <span id="headerTitle" class="text-lg font-bold tracking-wide text-slate-800 dark:text-white">Beszéd Teszt</span>
      </div>
      <button id="themeToggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition">🌓</button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center items-center gap-6 relative">
    
    <!-- 1) TÉMAKÖR VÁLASZTÓ KÉPERNYŐ -->
    <div id="topicScreen" class="w-full flex flex-col items-center justify-center text-center py-6 space-y-4">
      <p class="text-4xl">🎧</p>
      <h1 class="text-2xl md:text-3xl font-black tracking-tight">Válassz témakört a teszthez</h1>
      <p class="text-xs md:text-sm text-slate-400 max-w-sm">Gyakorold a dalokban szereplő kulcsmondatokat beszéd közben!</p>
      <div id="topicList" class="w-full max-w-sm space-y-3 pt-2"></div>
    </div>

    <!-- 2) DAL VÁLASZTÓ KÉPERNYŐ -->
    <div id="songScreen" class="hidden w-full flex-col items-center justify-center text-center py-6 space-y-4">
      <p class="text-3xl">🎵</p>
      <h2 id="songScreenTitle" class="text-xl md:text-2xl font-black tracking-tight"></h2>
      <p class="text-xs md:text-sm text-slate-400">Válassz dalt a teszthez:</p>
      <div id="songListInTopic" class="w-full max-w-sm space-y-3 pt-2"></div>
    </div>

    <!-- 3) KVÍZ KÉPERNYŐ -->
    <div id="quizContainer" class="hidden w-full flex-col items-center gap-6">
      <div class="w-full flex justify-between items-center text-sm font-bold text-slate-400">
        <span id="questionProgress">1 / 12 Mondat</span>
        <span id="flaggedCountDisplay" class="text-amber-600 dark:text-amber-400 font-medium hidden">Ismétlendő: 0</span>
      </div>

      <div id="quizBox" class="w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-8 md:p-12 flex flex-col justify-between min-h-[280px] transition-all relative overflow-hidden cursor-pointer" onclick="revealAnswer()">
        <div class="flex-1 flex flex-col justify-center space-y-6 my-auto text-center">
          <div>
            <p id="quizHungarian" class="text-xl md:text-2xl font-medium text-slate-800 dark:text-slate-200 leading-normal"></p>
          </div>

          <div id="cardDivider" style="display: none;" class="w-full border-t border-slate-100 dark:border-slate-700/60 my-2"></div>

          <div id="englishContainer" style="display: none;">
            <p id="quizEnglish" class="text-2xl md:text-3xl font-bold tracking-tight text-brand-600 dark:text-brand-400 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <div id="actionRow" style="display: none;" class="flex items-center gap-3 w-full">
        <button onclick="handleFeedback(true)" class="flex-1 py-4 rounded-xl border border-amber-400/60 bg-amber-50/40 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1.5 active:scale-95">
          ⚠️ Döcögős / Ismételjük
        </button>
        
        <button onclick="handleFeedback(false)" class="flex-[2] py-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md transition-all flex items-center justify-center gap-1.5 active:scale-95">
          ✅ Simán ment ➔
        </button>
      </div>
    </div>

    <!-- 4) EREDMÉNY KÉPERNYŐ -->
    <div id="resultBox" class="w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-8 text-center hidden flex-col items-center gap-5">
      <span class="text-5xl">🏆</span>
      <h2 class="text-2xl font-black">Beszéd teszt kész!</h2>
      <p id="finalScoreText" class="text-base text-slate-600 dark:text-slate-300"></p>
      
      <div class="flex flex-col sm:flex-row gap-3 w-full pt-4 border-t border-slate-100 dark:border-slate-700">
        <button onclick="restartQuiz(false)" class="flex-1 px-6 py-3.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-white font-bold rounded-xl transition active:scale-95">
          Újrakezdés 🔄
        </button>
        <button id="reviewFlaggedBtn" onclick="restartQuiz(true)" class="flex-1 px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition shadow-md hidden active:scale-95">
          Csak a döcögősek (0) 🎯
        </button>
      </div>
    </div>

    <div id="infoToast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white dark:bg-white/90 dark:text-slate-950 text-xs font-semibold py-2.5 px-4 rounded-xl shadow-lg backdrop-blur transition-all duration-500 opacity-0 pointer-events-none z-50">
      Mondd ki hangosan, majd kattints a kártyára az ellenőrzéshez!
    </div>

  </main>

  <script>
    const synth = window.speechSynthesis;
    const topics = (typeof TOPICS !== "undefined") ? TOPICS : [];

    let currentTopicIndex = null;
    let currentSongIndex = null;
    let cards = [];
    let quizSequence = [];
    let currentQuizIndex = 0;
    let isRevealed = false;
    let flaggedCards = [];
    let isFirstTimeEver = true;

    const topicScreen = document.getElementById('topicScreen');
    const songScreen = document.getElementById('songScreen');
    const quizContainer = document.getElementById('quizContainer');
    const resultBox = document.getElementById('resultBox');
    const topicList = document.getElementById('topicList');
    const songListInTopic = document.getElementById('songListInTopic');
    const songScreenTitle = document.getElementById('songScreenTitle');
    const headerTitle = document.getElementById('headerTitle');

    const quizBox = document.getElementById('quizBox');
    const quizHungarian = document.getElementById('quizHungarian');
    const quizEnglish = document.getElementById('quizEnglish');
    const cardDivider = document.getElementById('cardDivider');
    const englishContainer = document.getElementById('englishContainer');
    const actionRow = document.getElementById('actionRow');
    const reviewFlaggedBtn = document.getElementById('reviewFlaggedBtn');
    const questionProgress = document.getElementById('questionProgress');
    const flaggedCountDisplay = document.getElementById('flaggedCountDisplay');
    const finalScoreText = document.getElementById('finalScoreText');
    const infoToast = document.getElementById('infoToast');

    // Sötét mód kezelés
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildTopicList() {
      topicList.innerHTML = '';
      topics.forEach((topic, tIdx) => {
        const count = (topic.songs || []).reduce((acc, s) => acc + (s.cardsData ? s.cardsData.length : 0), 0);
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between gap-3 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-violet-400 rounded-2xl px-4 py-3.5 shadow-sm transition-all text-left active:scale-[0.98]";
        card.innerHTML = `
          <span>
            <span class="block font-bold text-base text-slate-800 dark:text-slate-100">${topic.title}</span>
            <span class="block text-xs text-slate-400">${topic.songs.length} dal, ${count} kártya</span>
          </span>
          <span class="text-violet-500 text-lg">❯</span>
        `;
        card.addEventListener('click', () => showSongScreen(tIdx));
        topicList.appendChild(card);
      });
    }

    function showSongScreen(topicIndex) {
      currentTopicIndex = topicIndex;
      const topic = topics[topicIndex];
      songScreenTitle.textContent = topic.title;
      headerTitle.textContent = topic.title;

      songListInTopic.innerHTML = '';
      (topic.songs || []).forEach((song, sIdx) => {
        const cardCount = song.cardsData ? song.cardsData.length : 0;
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between gap-3 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-violet-400 rounded-2xl px-4 py-3.5 shadow-sm transition-all text-left active:scale-[0.98]";
        card.innerHTML = `
          <span>
            <span class="block font-bold text-base text-slate-800 dark:text-slate-100">${song.title}</span>
            <span class="block text-xs text-slate-400">${cardCount} gyakorló kártya</span>
          </span>
          <span class="text-violet-500 text-lg">▶️</span>
        `;
        card.addEventListener('click', () => startQuizForSong(topicIndex, sIdx));
        songListInTopic.appendChild(card);
      });

      topicScreen.classList.add('hidden');
      songScreen.classList.remove('hidden');
      songScreen.classList.add('flex');
    }

    window.goBack = function() {
      if (!quizContainer.classList.contains('hidden') || !resultBox.classList.contains('hidden')) {
        quizContainer.classList.add('hidden');
        resultBox.classList.add('hidden');
        resultBox.classList.remove('flex');
        if (currentTopicIndex !== null) {
          showSongScreen(currentTopicIndex);
        } else {
          showTopicScreen();
        }
      } else if (!songScreen.classList.contains('hidden')) {
        showTopicScreen();
      } else {
        window.location.href = typeof BACK_LINK !== 'undefined' ? BACK_LINK : 'index.html';
      }
    };

    function showTopicScreen() {
      currentTopicIndex = null;
      currentSongIndex = null;
      headerTitle.textContent = "Beszéd Teszt";
      topicScreen.classList.remove('hidden');
      songScreen.classList.add('hidden');
      songScreen.classList.remove('flex');
      quizContainer.classList.add('hidden');
      resultBox.classList.add('hidden');
      resultBox.classList.remove('flex');
    }

    function startQuizForSong(topicIndex, songIndex) {
      currentTopicIndex = topicIndex;
      currentSongIndex = songIndex;
      const song = topics[topicIndex].songs[songIndex];
      cards = song.cardsData || [];
      headerTitle.textContent = song.title;

      if (cards.length === 0) {
        alert("Ehhez a dalhoz még nincsenek feltöltve tanulókártyák az adat.js-ben.");
        return;
      }

      songScreen.classList.add('hidden');
      songScreen.classList.remove('flex');
      quizContainer.classList.remove('hidden');
      quizContainer.classList.add('flex');

      initQuiz();
    }

    function initQuiz(onlyReviewMode = false) {
      if (onlyReviewMode && flaggedCards.length > 0) {
        quizSequence = shuffleArray(flaggedCards);
        flaggedCards = [];
      } else {
        quizSequence = shuffleArray(cards);
        flaggedCards = [];
      }

      currentQuizIndex = 0;
      updateFlaggedCounter();
      
      quizBox.style.display = 'flex';
      resultBox.classList.add('hidden');
      resultBox.classList.remove('flex');
      loadQuestion();

      if (isFirstTimeEver) {
        isFirstTimeEver = false;
        setTimeout(() => {
          infoToast.classList.remove('opacity-0');
          infoToast.classList.add('opacity-100');
          setTimeout(() => {
            infoToast.classList.remove('opacity-100');
            infoToast.classList.add('opacity-0');
          }, 4000);
        }, 400);
      }
    }

    function loadQuestion() {
      isRevealed = false;
      cardDivider.style.display = 'none';
      englishContainer.style.display = 'none';
      actionRow.style.display = 'none';
      
      if (synth) synth.cancel();

      const currentCard = quizSequence[currentQuizIndex];
      questionProgress.textContent = `${currentQuizIndex + 1} / ${quizSequence.length} Mondat`;
      quizHungarian.textContent = currentCard.hungarian;
      quizEnglish.textContent = currentCard.english.replace(/\*\*/g, '');
    }

    window.revealAnswer = function() {
      if (isRevealed) return;
      isRevealed = true;

      cardDivider.style.display = 'block';
      englishContainer.style.display = 'block';
      actionRow.style.display = 'flex';

      if (synth) {
        const textToSpeak = quizSequence[currentQuizIndex].english.replace(/\*\*/g, '');
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        synth.speak(utterance);
      }
    }

    window.handleFeedback = function(isFlagged) {
      const currentCard = quizSequence[currentQuizIndex];
      
      if (isFlagged) {
        if (!flaggedCards.some(c => c.keyword === currentCard.keyword)) {
          flaggedCards.push(currentCard);
          updateFlaggedCounter();
        }
      }

      if (currentQuizIndex < quizSequence.length - 1) {
        currentQuizIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    function updateFlaggedCounter() {
      if (flaggedCards.length > 0) {
        flaggedCountDisplay.textContent = `Ismétlendő: ${flaggedCards.length}`;
        flaggedCountDisplay.classList.remove('hidden');
      } else {
        flaggedCountDisplay.classList.add('hidden');
      }
    }

    function showResults() {
      if (synth) synth.cancel();
      quizBox.style.display = 'none';
      actionRow.style.display = 'none';
      resultBox.classList.remove('hidden');
      resultBox.classList.add('flex');
      
      if (flaggedCards.length === 0) {
        finalScoreText.innerHTML = "🎯 <strong>Zseniális!</strong> Minden mondat hiba nélkül ment!";
        reviewFlaggedBtn.classList.add('hidden');
      } else {
        finalScoreText.innerHTML = `Végigértél! Elmentettünk <strong class="text-amber-500 font-bold">${flaggedCards.length} darab</strong> olyan mondatot, amit még gyakorolni kell.`;
        reviewFlaggedBtn.textContent = `Csak a döcögősek (${flaggedCards.length}) 🎯`;
        reviewFlaggedBtn.classList.remove('hidden');
        reviewFlaggedBtn.classList.add('block');
      }
    }

    window.restartQuiz = function(onlyReview = false) {
      initQuiz(onlyReview);
    }

    // Kezdéskor betöltjük a témaköröket
    buildTopicList();
  </script>
</body>
</html>
