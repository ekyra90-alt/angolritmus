<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zene & Karaoke Lejátszó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adat.js"></script>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

  <!-- ... existing code ... -->
  <header class="border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950 py-4 px-6 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="tanulo_kartyak.html" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2 rounded-xl font-bold">❮ Vissza</a>
        <span class="text-base font-bold tracking-wide">Zenei Karaoke Stúdió</span>
      </div>
    </div>
  </header>

  <audio id="zene" preload="auto"></audio>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
    
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border shadow-sm">
      <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Válassz dalt a GitHubról</label>
      <select id="songSelector" class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-700 font-medium text-sm border-0 focus:ring-2 focus:ring-violet-500">
        <option value="">-- Válassz egy zenét --</option>
        <option value="https://raw.githubusercontent.com/ekyra90-alt/angolritmus/refs/heads/main/hipochondria.mp3">Hipochondria</option>
        <!-- Itt tudsz további opciókat hozzáadni a többi fájlodnak -->
      </select>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border shadow-sm space-y-4">
      <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Gyorsugrás Versszakokra</h3>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="verseBtnsContainer"></div>
      <!-- ... existing code ... -->
    </div>
    
    <!-- ... existing code ... -->
  </main>

  <script>
    const audio = document.getElementById("zene");
    const songSelector = document.getElementById("songSelector");
    const playPauseBtn = document.getElementById("playPauseBtn");

    // Új eseményfigyelő a lista váltásához
    songSelector.addEventListener('change', function(e) {
      const selectedUrl = e.target.value;
      if (selectedUrl) {
        audio.src = selectedUrl;
        audio.play();
        isMusicPlaying = true;
        playPauseBtn.textContent = "⏸️ Szünet";
      }
    });

    // ... existing code ... (a többi függvény marad)
    function buildUI() {
    // ... existing code ...
    }
  </script>
</body>
</html>
