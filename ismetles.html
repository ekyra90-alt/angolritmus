<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zene & Karaoke Lejátszó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adat.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

  <header class="border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950 py-4 px-6 sticky top-0 z-30 shadow-sm">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <span class="text-base font-bold tracking-wide">Zenei Karaoke Stúdió</span>
      <select id="songSelector" class="p-2 bg-slate-100 dark:bg-slate-800 border rounded-xl font-bold text-xs">
        <option value="">Válassz dalt...</option>
      </select>
    </div>
  </header>

  <audio id="zene" preload="auto"></audio>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col gap-4">
    <div class="bg-white dark:bg-slate-800 p-4 border rounded-2xl shadow-sm flex items-center gap-4">
      <button id="playPauseBtn" class="px-4 py-2 bg-violet-600 text-white rounded-xl font-bold text-xs">▶️ Lejátszás</button>
      <input type="range" id="progressBar" value="0" class="flex-1">
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl border p-6 space-y-6" id="lyricsBox"></div>
  </main>

  <script>
    const audio = document.getElementById("zene");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const progressBar = document.getElementById("progressBar");
    const lyricsBox = document.getElementById("lyricsBox");
    const songSelector = document.getElementById("songSelector");
    const synth = window.speechSynthesis;

    let activeSong = null;
    let mediaRecorder = null;
    let audioChunks = [];

    // Mikrofon engedély kérése és felvétel kezelése
    async function setupRecorder(recordBtn, playbackAudio) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        audioChunks = [];
        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
          const audioUrl = URL.createObjectURL(audioBlob);
          playbackAudio.src = audioUrl;
          playbackAudio.classList.remove('hidden');
        };

        return true;
      } catch (err) {
        alert("A mikrofon használata nem engedélyezett vagy nem érhető el.");
        return false;
      }
    }

    function initSelector() {
      if (typeof window.songs === 'undefined') { setTimeout(initSelector, 500); return; }
      window.songs.forEach(song => {
        const opt = document.createElement('option');
        opt.value = song.id;
        opt.textContent = song.title || song.id;
        songSelector.appendChild(opt);
      });

      songSelector.addEventListener('change', (e) => {
        activeSong = window.songs.find(s => s.id === e.target.value);
        if (activeSong) {
          audio.src = activeSong.id + ".mp3";
          buildUI(activeSong.structure);
        }
      });
    }

    function buildUI(structure) {
      lyricsBox.innerHTML = '';
      structure.forEach((verse) => {
        const vDiv = document.createElement('div');
        vDiv.className = "space-y-3";
        vDiv.innerHTML = `<h4 class="font-bold text-slate-400 text-xs uppercase tracking-wider">${verse.title}</h4>`;

        verse.lines.forEach((line) => {
          const lDiv = document.createElement('div');
          lDiv.className = "p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex flex-col gap-2 bg-slate-50 dark:bg-slate-900";

          const textRow = document.createElement('div');
          textRow.className = "flex items-center justify-between cursor-pointer";
          textRow.innerHTML = `
            <div>
              <p class="font-semibold text-sm">${line.text}</p>
              <p class="text-xs text-slate-400">${line.hungarian}</p>
            </div>
          `;
          // Sor lejátszása zenéből
          textRow.addEventListener('click', () => { audio.currentTime = line.start; audio.play(); });

          // Gombok sora: Felolvasás és Hangfelvétel
          const btnRow = document.createElement('div');
          btnRow.className = "flex items-center gap-2 pt-1 border-t border-slate-200 dark:border-slate-800";

          // Felolvasztás gomb
          const speakBtn = document.createElement('button');
          speakBtn.className = "px-2 py-1 bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-lg hover:bg-violet-100";
          speakBtn.textContent = "🗣️ Felolvas";
          speakBtn.addEventListener('click', () => {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(line.text.replace(/\*\*/g, ''));
            utter.lang = 'en-US';
            synth.speak(utter);
          });

          // Hangfelvevő gombok
          const recordBtn = document.createElement('button');
          recordBtn.className = "px-2 py-1 bg-rose-500 text-white text-xs font-bold rounded-lg";
          recordBtn.textContent = "🎙️ Felvétel";

          const playback = document.createElement('audio');
          playback.controls = true;
          playback.className = "hidden h-8 flex-1";

          let isRecording = false;
          recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
              const permitted = await setupRecorder(recordBtn, playback);
              if (permitted) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = "⏹️ Stop";
                recordBtn.className = "px-2 py-1 bg-amber-500 text-white text-xs font-bold rounded-lg animate-pulse";
              }
            } else {
              mediaRecorder.stop();
              isRecording = false;
              recordBtn.textContent = "🎙️ Újra";
              recordBtn.className = "px-2 py-1 bg-rose-500 text-white text-xs font-bold rounded-lg";
            }
          });

          btnRow.appendChild(speakBtn);
          btnRow.appendChild(recordBtn);
          btnRow.appendChild(playback);

          lDiv.appendChild(textRow);
          lDiv.appendChild(btnRow);
          vDiv.appendChild(lDiv);
        });
        lyricsBox.appendChild(vDiv);
      });
    }

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); playPauseBtn.textContent = "⏸️ Szünet"; } 
      else { audio.pause(); playPauseBtn.textContent = "▶️ Lejátszás"; }
    });

    audio.addEventListener('timeupdate', () => {
      if(!isNaN(audio.duration)) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    progressBar.addEventListener('input', (e) => {
      if (!isNaN(audio.duration)) audio.currentTime = (e.target.value / 100) * audio.duration;
    });

    window.addEventListener('load', initSelector);
  </script>
</body>
</html>
