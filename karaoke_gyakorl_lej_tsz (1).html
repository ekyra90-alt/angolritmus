<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zene & Karaoke Gyakorló</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adat.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300 select-none">

  <header class="border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950 py-3 px-4 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2">
        <a id="backLink" href="index.html" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold active:scale-95 transition-transform">❮ Vissza</a>
        <button id="homeBtn" class="hidden text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold active:scale-95 transition-transform">🏠 Témakörök</button>
        <span class="text-sm md:text-base font-bold tracking-wide truncate">Karaoke Stúdió <span class="text-violet-500">· Gyakorló</span></span>
      </div>
      <div class="flex items-center gap-2">
        <select id="songSelect" class="hidden text-xs md:text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 outline-none max-w-[160px] truncate"></select>
      </div>
    </div>
  </header>

  <audio id="zene" preload="auto"></audio>

  <main class="flex-1 max-w-2xl w-full mx-auto p-3 md:p-6 flex flex-col gap-4 md:gap-6">

    <!-- 1) TÉMAKÖR-VÁLASZTÓ KÉPERNYŐ -->
    <div id="topicScreen" class="flex-1 flex flex-col items-center justify-center text-center py-8 px-2 space-y-3">
      <p class="text-4xl md:text-5xl">🎤</p>
      <h1 class="text-2xl md:text-4xl font-black tracking-tight text-slate-800 dark:text-slate-100">Válassz témakört</h1>
      <p class="text-xs md:text-sm text-slate-400 max-w-sm mx-auto">A zene megáll a kulcsszavaknál — mondd ki hangosan, majd kattints a takart szóra a folytatáshoz!</p>
      <div id="topicList" class="w-full max-w-sm mx-auto space-y-3 pt-4"></div>
    </div>

    <!-- 2) DALVÁLASZTÓ KÉPERNYŐ -->
    <div id="songScreen" class="hidden flex-1 flex-col items-center justify-center text-center py-6 px-2 space-y-3">
      <button id="backToTopicsBtn" class="self-start text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-2.5 rounded-xl font-bold active:scale-95 transition-transform">❮ Témakörök</button>
      <p class="text-3xl md:text-4xl pt-2">🎵</p>
      <h2 id="songScreenTitle" class="text-xl md:text-3xl font-black tracking-tight text-slate-800 dark:text-slate-100"></h2>
      <p class="text-xs md:text-sm text-slate-400">Válassz dalt a karaoke gyakorláshoz:</p>
      <div id="songListInTopic" class="w-full max-w-sm mx-auto space-y-3 pt-4"></div>
    </div>

    <!-- 3) LEJÁTSZÓ FELÜLET -->
    <div id="playerScreen" class="hidden flex-1 flex-col gap-4">

      <div id="loadError" class="hidden bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-300 text-xs md:text-sm font-bold rounded-2xl p-4"></div>

      <div id="playerControlsSticky" class="sticky top-10 z-10 bg-slate-50 dark:bg-slate-900 pb-2 space-y-2.5">
        <div class="bg-white dark:bg-slate-800 p-3 border rounded-2xl shadow-sm space-y-2.5">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2">
              <button id="playPauseBtn" class="px-4 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-bold text-xs md:text-sm active:scale-95 transition-transform">▶️ Lejátszás</button>
              <span id="karaokeStatus" class="text-xs font-semibold text-violet-600 dark:text-violet-400">🎤 Karaoke mód aktív</span>
            </div>
            <select id="playbackSpeedSelect" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-violet-500">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="0.9">0.9x</option>
              <option value="1.0" selected>1.0x</option>
              <option value="1.25">1.25x</option>
            </select>
          </div>

          <!-- 5mp tekerő gombok és haladási sáv -->
          <div class="flex items-center gap-2">
            <button id="seekBackBtn" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 rounded-xl font-bold text-xs active:scale-95 transition-transform">⏪ 5mp</button>
            <div class="flex-1 flex items-center gap-2.5">
              <span id="currentTime" class="text-xs font-mono text-slate-400 min-w-[32px]">0:00</span>
              <input type="range" id="progressBar" value="0" class="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none accent-violet-600">
              <span id="duration" class="text-xs font-mono text-slate-400 min-w-[32px]">0:00</span>
            </div>
            <button id="seekForwardBtn" class="p-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 rounded-xl font-bold text-xs active:scale-95 transition-transform">5mp ⏩</button>
          </div>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl border p-4 md:p-6 space-y-4" id="lyricsBox"></div>

    </div>

    <div id="emptyState" class="hidden bg-white dark:bg-slate-800 rounded-3xl border p-6 text-center space-y-2">
      <p class="text-3xl">🎼</p>
      <p class="font-bold text-sm md:text-base">Még nincs feltöltve témakör/dal ebbe a sablonba.</p>
    </div>

  </main>

  <script>
    const audio = document.getElementById("zene");

    window.toggleBlank = function(event, blankKey, lineEnd) {
      if (event) event.stopPropagation();
      const el = document.getElementById(`blank-${blankKey}`);
      if (!el) return;
      const word = el.dataset.word;
      
      const revealedClasses = ['text-violet-600', 'dark:text-violet-400', 'font-black', 'border-solid', 'border-violet-400', 'dark:border-violet-500', 'tracking-normal'];
      const hiddenClasses = ['text-violet-300', 'dark:text-violet-700', 'tracking-widest', 'border-dotted', 'border-violet-300', 'dark:border-violet-600'];

      if (revealedWords[blankKey]) {
        delete revealedWords[blankKey];
        el.textContent = word.replace(/[^\s]/g, '_');
        el.classList.remove(...revealedClasses);
        el.classList.add(...hiddenClasses);
      } else {
        revealedWords[blankKey] = true;
        el.textContent = word;
        el.classList.remove(...hiddenClasses);
        el.classList.add(...revealedClasses);
        
        if (waitingForUser && currentPauseLine && currentPauseLine.end === lineEnd) {
          waitingForUser = false;
          document.getElementById('karaokeStatus').textContent = "🎤 Lejátszás folyamatban...";
          audio.play().catch(e => console.log(e));
        }
      }
    };

    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekBackBtn = document.getElementById("seekBackBtn");
    const seekForwardBtn = document.getElementById("seekForwardBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeText = document.getElementById("currentTime");
    const durationText = document.getElementById("duration");
    const playbackSpeedSelect = document.getElementById("playbackSpeedSelect");
    const lyricsBox = document.getElementById("lyricsBox");
    const emptyState = document.getElementById("emptyState");
    const loadError = document.getElementById("loadError");
    const backLink = document.getElementById("backLink");
    const homeBtn = document.getElementById("homeBtn");
    const songSelect = document.getElementById("songSelect");

    const topicScreen = document.getElementById("topicScreen");
    const topicList = document.getElementById("topicList");
    const songScreen = document.getElementById("songScreen");
    const songScreenTitle = document.getElementById("songScreenTitle");
    const songListInTopic = document.getElementById("songListInTopic");
    const backToTopicsBtn = document.getElementById("backToTopicsBtn");
    const playerScreen = document.getElementById("playerScreen");

    let isMusicPlaying = false;
    let currentSong = null;
    let revealedWords = {};
    let currentTopicIndex = 0;
    let currentSongIndex = 0;
    let waitingForUser = false;
    let currentPauseLine = null;
    let lastActiveLineKey = null;

    if (typeof BACK_LINK !== "undefined") backLink.href = BACK_LINK;
    const topics = (typeof TOPICS !== "undefined") ? TOPICS : [];

    const flatSongs = [];
    topics.forEach((topic, tIdx) => {
      (topic.songs || []).forEach((song, sIdx) => {
        flatSongs.push({ topicIndex: tIdx, songIndex: sIdx, topic, song });
      });
    });

    function showTopicScreen() {
      audio.pause();
      isMusicPlaying = false;
      topicScreen.classList.remove('hidden');
      songScreen.classList.add('hidden');
      songScreen.classList.remove('flex');
      playerScreen.classList.add('hidden');
      playerScreen.classList.remove('flex');
      songSelect.classList.add('hidden');
      homeBtn.classList.add('hidden');
    }

    function showSongScreen(topicIndex) {
      currentTopicIndex = topicIndex;
      const topic = topics[topicIndex];
      songScreenTitle.textContent = topic.title;

      songListInTopic.innerHTML = '';
      (topic.songs || []).forEach((song, sIdx) => {
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between gap-3 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-violet-400 rounded-2xl px-4 py-3.5 shadow-sm transition-all text-left active:scale-[0.98]";
        card.innerHTML = `
          <span class="font-bold text-base md:text-lg text-slate-800 dark:text-slate-100">${song.title}</span>
          <span class="text-violet-500 text-lg">▶️</span>
        `;
        card.addEventListener('click', () => selectSong(topicIndex, sIdx));
        songListInTopic.appendChild(card);
      });

      topicScreen.classList.add('hidden');
      songScreen.classList.remove('hidden');
      songScreen.classList.add('flex');
      playerScreen.classList.add('hidden');
      playerScreen.classList.remove('flex');
    }

    function buildTopicList() {
      topicList.innerHTML = '';
      topics.forEach((topic, tIdx) => {
        const count = (topic.songs || []).length;
        const card = document.createElement('button');
        card.className = "w-full flex items-center justify-between gap-3 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-violet-400 rounded-2xl px-4 py-3.5 shadow-sm transition-all text-left active:scale-[0.98]";
        card.innerHTML = `
          <span>
            <span class="block font-bold text-base md:text-lg text-slate-800 dark:text-slate-100">${topic.title}</span>
            <span class="block text-xs text-slate-400">${count} dal</span>
          </span>
          <span class="text-violet-500 text-lg">❯</span>
        `;
        card.addEventListener('click', () => showSongScreen(tIdx));
        topicList.appendChild(card);
      });
    }

    function buildSongSelect() {
      songSelect.innerHTML = '';
      topics.forEach((topic, tIdx) => {
        const group = document.createElement('optgroup');
        group.label = topic.title;
        (topic.songs || []).forEach((song, sIdx) => {
          const opt = document.createElement('option');
          opt.value = `${tIdx}-${sIdx}`;
          opt.textContent = song.title;
          group.appendChild(opt);
        });
        songSelect.appendChild(group);
      });
    }

    songSelect.addEventListener('change', () => {
      const [tIdx, sIdx] = songSelect.value.split('-').map(Number);
      selectSong(tIdx, sIdx);
    });

    homeBtn.addEventListener('click', showTopicScreen);
    backToTopicsBtn.addEventListener('click', showTopicScreen);

    function selectSong(topicIndex, songIndex) {
      currentTopicIndex = topicIndex;
      currentSongIndex = songIndex;
      topicScreen.classList.add('hidden');
      songScreen.classList.add('hidden');
      songScreen.classList.remove('flex');
      playerScreen.classList.remove('hidden');
      playerScreen.classList.add('flex');
      songSelect.classList.remove('hidden');
      homeBtn.classList.remove('hidden');

      songSelect.value = `${topicIndex}-${songIndex}`;
      loadSong(topics[topicIndex].songs[songIndex]);
    }

    function loadSong(song) {
      currentSong = song;
      waitingForUser = false;
      currentPauseLine = null;
      lastActiveLineKey = null;
      revealedWords = {};

      audio.pause();
      isMusicPlaying = false;
      playPauseBtn.textContent = "▶️ Lejátszás";
      loadError.classList.add('hidden');

      audio.src = currentSong.localAudio || "";
      audio.load();
      audio.playbackRate = parseFloat(playbackSpeedSelect.value) || 1.0;

      audio.onerror = function() {
        if (currentSong.fallbackAudio && audio.src.indexOf(currentSong.fallbackAudio) === -1) {
          audio.src = currentSong.fallbackAudio;
          audio.load();
        } else {
          loadError.textContent = `Nem sikerült betölteni a(z) "${currentSong.title}" hangfájlját.`;
          loadError.classList.remove('hidden');
        }
      };

      buildUI();
    }

    function buildUI() {
      const hasSong = currentSong && currentSong.songStructureData && currentSong.songStructureData.length > 0;
      emptyState.classList.toggle('hidden', hasSong);
      if (!hasSong) {
        lyricsBox.innerHTML = '';
        return;
      }

      const structure = currentSong.songStructureData;
      lyricsBox.innerHTML = '';

      structure.forEach((verse, vIdx) => {
        const vDiv = document.createElement('div'); vDiv.className = "space-y-2 p-1 md:p-2";
        const vTitle = document.createElement('h4'); vTitle.className = "text-xs font-bold text-slate-400 tracking-wider mb-2";
        vTitle.textContent = verse.title; vDiv.appendChild(vTitle);

        verse.lines.forEach((line, lIdx) => {
          const lDiv = document.createElement('div');
          lDiv.className = "p-2.5 rounded-xl border border-transparent transition-all flex items-start gap-2.5 scroll-mt-[230px]";
          lDiv.id = `line-${vIdx}-${lIdx}`;

          const textWrap = document.createElement('div'); textWrap.className = "flex-1 min-w-0";
          const eng = document.createElement('p'); eng.className = "text-base md:text-lg font-semibold break-words leading-snug";
          
          let occ = 0;
          eng.innerHTML = line.text.replace(/\*\*(.*?)\*\*/g, (m, word) => {
            const clean = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const blankKey = `${vIdx}-${lIdx}-${occ++}`;
            const masked = word.replace(/[^\s]/g, '_');
            const escWord = word.replace(/'/g, "\\'");
            const escClean = clean.replace(/'/g, "\\'");
            return `<span id="blank-${blankKey}" data-word="${escWord}" data-clean="${escClean}" onclick="toggleBlank(event, '${blankKey}', ${line.end})" class="blank-chip cursor-pointer select-none px-2 py-0.5 rounded-md mx-0.5 whitespace-nowrap inline-block border-b-2 border-dotted border-violet-400 dark:border-violet-500 text-violet-400 dark:text-violet-300 font-bold tracking-widest bg-violet-50 dark:bg-violet-950/40">${masked}</span>`;
          });

          const hun = document.createElement('p'); hun.className = "text-sm text-slate-400 mt-1";
          hun.textContent = line.hungarian;
          textWrap.appendChild(eng); textWrap.appendChild(hun);

          lDiv.appendChild(textWrap);
          vDiv.appendChild(lDiv);
        });
        lyricsBox.innerHTML += vDiv.outerHTML;
      });
    }

    playPauseBtn.addEventListener('click', () => {
      if (isMusicPlaying) {
        audio.pause();
        isMusicPlaying = false;
        waitingForUser = false;
        playPauseBtn.textContent = "▶️ Lejátszás";
        document.getElementById('karaokeStatus').textContent = "⏸️ Szüneteltetve";
      } else {
        audio.play().catch(e => console.log(e));
        isMusicPlaying = true;
        waitingForUser = false;
        playPauseBtn.textContent = "⏸️ Szünet";
        document.getElementById('karaokeStatus').textContent = "🎤 Karaoke mód aktív";
      }
    });

    seekBackBtn.addEventListener('click', () => {
      if (!isNaN(audio.duration)) {
        waitingForUser = false;
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      }
    });

    seekForwardBtn.addEventListener('click', () => {
      if (!isNaN(audio.duration)) {
        waitingForUser = false;
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      }
    });

    audio.addEventListener('timeupdate', () => {
      let cur = audio.currentTime;
      const dur = audio.duration || 100;
      if (!isNaN(audio.duration)) {
        progressBar.value = (cur / dur) * 100;
        currentTimeText.textContent = formatTime(cur);
        durationText.textContent = formatTime(dur);
      }

      if (waitingForUser) return;

      if (currentSong && currentSong.songStructureData) {
        let activeKey = null;
        let activeIsVerseStart = false;

        currentSong.songStructureData.forEach((verse, vIdx) => {
          verse.lines.forEach((line, lIdx) => {
            const hasKeyword = /\*\*(.*?)\*\*/.test(line.text);
            const el = document.getElementById(`line-${vIdx}-${lIdx}`);
            
            if (el) {
              if (cur >= line.start && cur < line.end) {
                el.classList.add('bg-violet-50', 'dark:bg-violet-900/30', 'border-violet-300', 'scale-[1.01]');
                activeKey = `${vIdx}-${lIdx}`;
                activeIsVerseStart = (lIdx === 0);

                if (hasKeyword && cur >= line.start && cur < line.start + 0.3 && !waitingForUser) {
                  let hasUnrevealed = false;
                  const chips = el.querySelectorAll('.blank-chip');
                  chips.forEach(chip => {
                    const idParts = chip.id.replace('blank-', '').split('-');
                    const bKey = `${idParts[0]}-${idParts[1]}-${idParts[2]}`;
                    if (!revealedWords[bKey]) hasUnrevealed = true;
                  });

                  if (hasUnrevealed) {
                    audio.pause();
                    audio.currentTime = line.start;
                    waitingForUser = true;
                    currentPauseLine = line;
                    document.getElementById('karaokeStatus').textContent = "⏳ Mondd ki hangosan és kattints a szóra!";
                  }
                }
              } else {
                el.classList.remove('bg-violet-50', 'dark:bg-violet-900/30', 'border-violet-300', 'scale-[1.01]');
              }
            }
          });
        });

        if (activeKey && activeKey !== lastActiveLineKey) {
          lastActiveLineKey = activeKey;
          if (activeIsVerseStart) {
            const el = document.getElementById(`line-${activeKey}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      }
    });

    progressBar.addEventListener('input', (e) => {
      if (!isNaN(audio.duration)) {
        waitingForUser = false;
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    playbackSpeedSelect.addEventListener('change', () => {
      audio.playbackRate = parseFloat(playbackSpeedSelect.value) || 1.0;
    });

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    if (flatSongs.length) {
      buildTopicList();
      buildSongSelect();
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get('song');
      if (requestedId) {
        const found = flatSongs.find(f => f.song.id === requestedId);
        if (found) selectSong(found.topicIndex, found.songIndex);
      }
    } else {
      topicScreen.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }
  </script>
</body>
</html>
