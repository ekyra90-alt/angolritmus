<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalfeldolgozó</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">Zenélő Kezelőfelület</h1>
        
        <div id="ui-container" class="space-y-4">
            <div id="status" class="p-3 bg-blue-50 text-blue-700 rounded-lg text-center text-sm font-medium">
                Keresés a fájlrendszerben...
            </div>
        </div>
        
        <audio id="audio-player" class="w-full mt-6" controls>
            A böngésződ nem támogatja a lejátszót.
        </audio>

        <div class="mt-6 text-xs text-slate-400 text-center">
            Tipp: Ha a dal nem indul, győződj meg róla, hogy a <code>music/hipochondria.mp3</code> elérhető a gyökérben.
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const statusText = document.getElementById('status');

        async function init() {
            // A fájl relatív útja a HTML fájlhoz képest
            const audioPath = "music/hipochondria.mp3";
            
            console.log("Próbálkozás a fájl elérésével:", audioPath);
            audio.src = audioPath;
            
            // Sikeres betöltés eseménykezelője
            audio.addEventListener('canplaythrough', () => {
                statusText.innerText = "Dal készen áll a lejátszásra!";
                statusText.className = "p-3 bg-green-50 text-green-700 rounded-lg text-center text-sm font-medium";
            });

            // Hiba eseménykezelője
            audio.addEventListener('error', (e) => {
                statusText.innerText = "Hiba: A fájl nem található (" + audioPath + ")";
                statusText.className = "p-3 bg-red-50 text-red-700 rounded-lg text-center text-sm font-medium";
                
                console.error("Audio hiba:", e);
                console.warn("Ellenőrzési lista: 1. Van-e 'music' mappa? 2. 'hipochondria.mp3' kisbetűs-e? 3. A fájl nem 0 bájtos-e?");
            });
        }

        // Az oldal betöltésekor indítjuk a keresést
        window.onload = init;
    </script>
</body>
</html>
